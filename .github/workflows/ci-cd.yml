name: CI/CD HTML + CSS para GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Validação e Verificação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar existência do index.html e arquivos estáticos
        run: |
          test -f index.html
          echo "index.html encontrado."
          find . -maxdepth 3 -type f \( -name "*.html" -o -name "*.css" \)

      - name: Validar sintaxe básica dos arquivos CSS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checar chaves e estrutura CSS
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === ".git" || entry.name === ".github" || entry.name === "node_modules") continue;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.endsWith(".css")) {
                  const content = fs.readFileSync(full, "utf8");
                  const open = (content.match(/{/g) || []).length;
                  const close = (content.match(/}/g) || []).length;
                  if (open !== close) {
                    console.error(`Chaves desbalanceadas em ${full}: {=${open}, }=${close}`);
                    process.exit(1);
                  }
                  console.log(`CSS OK: ${full}`);
                }
              }
            }

            walk(".");
          '

  deploy:
    name: CD - Deploy no GitHub Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4